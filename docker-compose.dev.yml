name: robinhoodgo-dev

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    environment:
      APP_ENV: development
      PORT: "3001"
      DATABASE_URL: postgres://robinhood:robinhood@postgres:5432/robinhood?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /data/uploads
    ports:
      - "${DEV_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/workspace
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
      - uploads-dev:/data/uploads
    command: ["go", "run", "-mod=mod", "./cmd/server"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: robinhood
      POSTGRES_PASSWORD: robinhood
      POSTGRES_DB: robinhood
    ports:
      - "${DEV_POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robinhood -d robinhood"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "${DEV_REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-dev:
    name: robinhoodgo_postgres-dev
  uploads-dev:
    name: robinhoodgo_uploads-dev
  go-build-cache:
  go-mod-cache:
